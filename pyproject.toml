[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "awscan"
version = "1.1.0"
description = "Automated web vulnerability scanner for authorized security testing — zero dependencies, stdlib only"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "0xgetz" }]
keywords = ["security", "vulnerability-scanner", "bug-bounty", "sqli", "xss", "authorized-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
awscan = "awscan.cli:main"

[tool.setuptools]
packages = ["awscan"]
