<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- awscan mark: a radar scope held inside a bracketed gate.
       Brackets = the hard scope gate; rings/sweep = the scanner; dot = a confirmed finding. -->
  <rect width="512" height="512" rx="104" fill="#12181F"/>

  <!-- corner brackets (scope gate) -->
  <g stroke="#DDE4EC" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M100 168 L100 100 L168 100"/>
    <path d="M344 100 L412 100 L412 168"/>
    <path d="M412 344 L412 412 L344 412"/>
    <path d="M168 412 L100 412 L100 344"/>
  </g>

  <!-- radar rings -->
  <circle cx="256" cy="256" r="118" fill="none" stroke="#3A4654" stroke-width="10"/>
  <circle cx="256" cy="256" r="64" fill="none" stroke="#3A4654" stroke-width="10"/>

  <!-- sweep arm -->
  <line x1="256" y1="256" x2="352" y2="160" stroke="#E8A33D" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="16" fill="#DDE4EC"/>

  <!-- confirmed finding -->
  <circle cx="316" cy="212" r="26" fill="#E8A33D"/>
  <circle cx="188" cy="322" r="12" fill="#3A4654"/>
</svg>
