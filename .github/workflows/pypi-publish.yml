name: Publish to PyPI

# Trusted Publishing (OIDC) — no long-lived API token stored anywhere.
# Fires when a GitHub Release is published.
# One-time setup on PyPI: Manage Hosting → "Add Publisher" →
#   PyPI project: awscan | Owner: 0xgetz | Repository: awscan
#   Workflow name: pypi-publish.yml | Environment name: pypi (leave blank if unused)
# See README "Publishing" section.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC for Trusted Publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: twine check
        run: |
          python -m pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
